services:

  mysql:
    image: mysql:8.0
    container_name: hms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: anushka
      MYSQL_DATABASE: hms
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: hms-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data: